<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <cc:interface>
        <cc:attribute
            type="br.org.carameloCode.erp.modulo.projeto.console.ConsoleCRCProjeto"
            name="console"
            required="true"
            shortDescription="console"
            />
        <cc:attribute name="id" default="consoleProjCRC" />
    </cc:interface>

    <!-- IMPLEMENTATION br.org.coletivoJava.fw.erp.implementacao.chat.atendente.JanelaChatSessaoUpdate -->
    <cc:implementation>

        <h:outputStylesheet name="crcConsole.css" library="CRCconsole" />
        <h:form>

            <p:card styleClass="Container12 OrganizadorContainer" >

                <h:panelGroup layout="block" styleClass="Container12" >
                    <h:panelGroup layout="block" styleClass="Container6" >
                        #{cc.attrs.console.projetoSelecionado.nome}
                    </h:panelGroup>
                    <h:panelGroup layout="block" styleClass="Container6" >


                    </h:panelGroup>

                </h:panelGroup>

                <p:autoComplete id="itemTip" value="#{cc.attrs.console.textoDefinido}"
                                completeMethod="#{cc.attrs.console.autocompletProjeto}"
                                var="opcao" itemLabel="#{opcao}" itemValue="#{opcao}"
                                styleClass="CRCConsole"
                                scrollHeight="250">
                    <f:facet name="itemtip">
                        <h:panelGrid columns="2" cellpadding="5">
                            <f:facet name="header">
                                <h:panelGroup layout="block" rendered="#{not empty cc.attrs.console.projetoSelecionado}" >
                                    #{cc.attrs.console.projetoSelecionado}
                                </h:panelGroup>


                            </f:facet>

                            <h:outputText value="Name"/>
                            <h:outputText value="#{country.name}"/>

                            <h:outputText value="Code"/>
                            <h:outputText value="#{country.code}"/>
                        </h:panelGrid>
                    </f:facet>

                    <f:facet name="footer">
                        <div class="ui-fluid" style="padding:0.5rem 1rem 1rem 1rem">
                            <p:staticMessage severity="info" summary="#{cc.attrs.console.textoDica}" />


                            <c:forEach var="opcao" items="#{cc.attrs.console.opcoesDisponiveis}" >
                                <h:panelGroup layout="block" >
                                    <p:commandButton  update="areaOpcaoSelecionada" value="#{opcao.acaoAssociada.nomeAcao} #{opcao.itemAssociado.nome}  (CTR+ #{opcao.ordem})" styleClass="" style="background-color: #{opcao.acaoAssociada.cor}">
                                        <f:setPropertyActionListener target="#{cc.attrs.console.opcaoSelecionada}" value="#{opcao}" />
                                    </p:commandButton>

                                </h:panelGroup>

                            </c:forEach>


                        </div>
                    </f:facet>
                </p:autoComplete>

            </p:card>
            <h:panelGroup layout="block" styleClass="Container12" id="areaOpcaoSelecionada" >
                <h:panelGroup rendered="#{not empty cc.attrs.console.opcaoSelecionada.acaoFormularioDetalhes}" >
                    #{cc.attrs.console.opcaoSelecionada}
                    #{pgUtilAcoes.getUrlAcao(cc.attrs.console.opcaoSelecionada.acaoFormularioDetalhes, cc.attrs.console.opcaoSelecionada.itemAssociado)}
                </h:panelGroup>
            </h:panelGroup>
        </h:form>

    </cc:implementation>

</ui:composition>
