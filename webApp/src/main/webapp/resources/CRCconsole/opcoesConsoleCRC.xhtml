<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:f="http://xmlns.jcp.org/jsf/core">

    <!-- Grade de opções do console: um botão por ItemOpcaoConsole, com atalho CTRL + SHIFT + ordem -->
    <cc:interface>
        <cc:attribute
            type="br.org.carameloCode.erp.modulo.projeto.console.ConsoleCRCProjeto"
            name="console"
            required="true"
            shortDescription="Console que fornece opcoesDisponiveis e recebe opcaoSelecionada"
            />
        <cc:attribute
            name="atualizar"
            default="@form:areaOpcaoSelecionada"
            shortDescription="Expressão de busca (update) atualizada ao escolher uma opção"
            />
    </cc:interface>

    <cc:implementation>

        <h:outputStylesheet name="crcConsole.css" library="CRCconsole" />

        <h:panelGroup layout="block" styleClass="crc-opcoes-console-crc" >
            <!-- ui:repeat (e não c:forEach): reavaliado a cada consulta ajax do autocomplete -->
            <ui:repeat var="opcao" value="#{cc.attrs.console.opcoesDisponiveis}" >
                <h:panelGroup layout="block" styleClass="crc-opcoes-console-crc__opcao" >
                    <!-- commandLink permite marcação interna para destacar o atalho -->
                    <!-- process @this: não reenviar o autocomplete (evita recalcular a lista antes da ação) -->
                    <!-- crc-console-projeto-crc__opcao-botao: mantido só como gancho do crcConsole.js (atalhos de teclado) -->
                    <p:commandLink process="@this" update="#{cc.attrs.atualizar}"
                                   styleClass="crc-opcoes-console-crc__botao crc-console-projeto-crc__opcao-botao"
                                   pt:data-crc-ordem="#{opcao.ordem}"

                                   actionListener="#{cc.attrs.console.executarOpcaoSelecionada()}"
                                   style="#{empty opcao.acaoAssociada.cor ? '' : '--crc-console-cor: '.concat(opcao.acaoAssociada.cor)}">
                        <f:setPropertyActionListener target="#{cc.attrs.console.opcaoSelecionada}" value="#{opcao}" />
                        <span class="crc-opcoes-console-crc__texto">
                            #{opcao.acaoAssociada.nomeAcao} #{opcao.itemAssociado.nome}
                        </span>
                        <kbd class="crc-opcoes-console-crc__atalho">CTRL + SHIFT + #{opcao.ordem}</kbd>
                    </p:commandLink>
                </h:panelGroup>
            </ui:repeat>
        </h:panelGroup>

    </cc:implementation>

</ui:composition>
