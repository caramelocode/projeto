<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <style>
            :root {
                --crc-embed-largura-maxima: #{largura}px;
                --crc-embed-altura-maxima: #{altura}px;
            }
        </style>
        <ui:include src="folhasDeEstiloBasicas.xhtml" />
        <ui:insert name="head"/>

    </h:head>
    <h:body>

        <h:panelGroup id="#{layoutIdsAreasConhecidas.AREA_MENSAGEM_INTERFACE}">
            <p:growl class="mensagemGrowl"  widgetVar="#{layoutIdsAreasConhecidas.AREA_MENSAGEM_INTERFACE}"/>
        </h:panelGroup>
        <c:if test="#{empty largura or empty altura}">
            <div class="crc-quadro-erro">
                quadroInterno: os parâmetros "largura" e "altura" são obrigatórios.
            </div>
        </c:if>

        <p:ajaxStatus style="width:32px;height:32px;position:fixed;right:60px;bottom:37px">
            <f:facet name="start">
                <p:graphicImage name="recursos/img/preloader.gif" library="SBComp"/>
            </f:facet>

            <f:facet name="complete">
                <h:outputText />
            </f:facet>
        </p:ajaxStatus>
        <ui:include src="cabecalhoInicialDoBody.xhtml" />
    </h:body>
</html>
