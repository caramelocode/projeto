<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:CarameloNav="http://xmlns.jcp.org/jsf/composite/carameloStore/seletorAcao"
                xmlns:SBAcaoNav="http://xmlns.jcp.org/jsf/composite/SBComp/composite/acoesENavegacao"
                xmlns:SBpaginaAtual="http://xmlns.jcp.org/jsf/composite/SBComp/composite/paginaAtualDeEntidade"
                >
    <div class="" style="position: relative">
        <div class="CardTopic " style="margin-left: 10px; height: 100px;padding: 10px;">
            #{paginaAtual.infoPagina.comoFormularioWeb.acaoSelecionada.nomeAcao}
            <i class="#{paginaAtual.infoPagina.comoFormularioWeb.acaoVinculada.iconeAcao} Fs30 Fleft MarRight10"></i>
            <br/>
            <div class="quebraBlocoComEspacoVertical10 somenteMobile"></div>
            <span class="CardSubTopic">
                #{paginaAtual.infoPagina.comoFormularioWeb.acaoSelecionada.descricao}
            </span>
            <h:panelGroup styleClass="Container12" layout="block">
                <h:panelGroup styleClass="Fright Container3" layout="block">
                    <h:form rendered="#{paginaAtual.infoPagina.comoPaginaEntidade.temAcoesMultiplasNovoRegistro}" >
                        <CarameloNav:seletorAcaoRadial metodo="#{paginaAtual.infoPagina.comoFormularioWeb.executarAcaoSelecionada()}"
                                                       opcaoSelecionada="#{paginaAtual.infoPagina.comoFormularioWeb.acaoSelecionada}"
                                                       opcoes="#{paginaAtual.infoPagina.comoPaginaEntidade.acoesNovoRegistro}"/>
                    </h:form>
                    <h:form rendered="#{paginaAtual.infoPagina.comoPaginaEntidade.acaoNovoRegistro!=null and !paginaAtual.infoPagina.comoPaginaEntidade.temAcoesMultiplasNovoRegistro}">
                        <SBpaginaAtual:botaoAcaoPersonalizada
                            acao="#{paginaAtual.infoPagina.comoPaginaEntidade.acaoNovoRegistro}"
                            />
                    </h:form>
                    <ui:insert name="conteudoDireita" />
                </h:panelGroup>
            </h:panelGroup>
        </div>
        <div class="quebraBlocoComEspacoVertical10"></div>

        <ui:insert name="conteudo" />
    </div>
</ui:composition>
