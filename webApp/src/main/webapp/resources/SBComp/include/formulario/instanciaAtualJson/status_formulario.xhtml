<ui:composition
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
    <f:facet name="view">
        <f:attribute name="contentType" value="application/json" />
    </f:facet>
    <c:if test="#{pgUtilContextoPorID.temContextoAtivo}" >
        {
        "temFormInstanciado": true,
        "formulario": "#{pgUtilContextoPorID.paginaDoContexto.xhtmlAcaoAtual}",
        "titulo": "#{pgUtilContextoPorID.paginaDoContexto.xhtmlAcaoAtual}",
        "respostaRegistrada": "#{pgUtilContextoPorID.paginaDoContexto}"
        }
    </c:if>
    <c:if test="#{!pgUtilContextoPorID.temContextoAtivo}" >
        {
        "temFormInstanciado": false
        }
    </c:if>
</ui:composition>
